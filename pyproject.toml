[project]
name = "fastapi-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",  # Ошибки импорта: неправильное расположение импортов и другие нарушения (pycodestyle)
    "E7",  # Ошибки синтаксического оформления: лишние выражения, некорректные сравнения (pycodestyle)
    "E9",  # Серьезные синтаксические ошибки: неправильные отступы и другие ошибки (pycodestyle)
    "F",   # Pyflakes: неиспользуемые импорты, неопределенные переменные и другие потенциальные ошибки
    "I",   # isort: проверка порядка и группировки импортов
    "B",   # flake8-bugbear: распространенные ошибки и потенциально опасные конструкции Python
    "UP",  # pyupgrade: устаревший синтаксис Python, который можно заменить современным
]


[tool.pytest.ini_options]
testpaths = ["tests"]  # устанавливаем папку для тестов
asyncio_mode = "auto"  # автоматическая обработка асинхронных тестовых функций
asyncio_default_fixture_loop_scope = "function"  # область действия event loop на уровне отдельной тестовой функции
