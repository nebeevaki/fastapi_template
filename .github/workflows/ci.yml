name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U test -d app_test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/app_test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          version: "0.10.4"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check lint
        run: uv run ruff check app tests migrations

      - name: Check formatting
        run: uv run ruff format --check app tests migrations

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check migrations
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest -q
